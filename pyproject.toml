[project]
name = "decision-models-review"
version = "0.1.0"
description = "Harness, analysis and data manifest for a review of decision models on agent tool-call gating"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
